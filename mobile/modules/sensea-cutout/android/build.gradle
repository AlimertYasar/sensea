plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.senseacutout'
version = '1.0.0'

android {
  namespace "expo.modules.senseacutout"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Unbundled: the segmentation model comes from Google Play services, so the APK stays small.
  implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
}
